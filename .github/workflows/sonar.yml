name: Analyze code using Sonar

# Works against both SonarQube Cloud and a self-hosted SonarQube Server. Configure the repository as
# follows:
#
#   Secret  SONAR_TOKEN         required, the analysis token
#   Var     SONAR_PROJECT_KEY   required, e.g. "supabase-community_supabase-kt"
#   Var     SONAR_HOST_URL      optional, defaults to https://sonarcloud.io
#   Var     SONAR_ORGANIZATION  required for SonarQube Cloud, leave unset for a self-hosted server

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Pull requests from forks have no access to the analysis token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs the full history to assign issues to the right commits
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@16bf8bc8fe830fa669c3c9f914d3eb147c629707 # v4.0.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # Runs the tests, the coverage reports and detekt, then uploads everything to Sonar.
      - name: Analyze code using Sonar
        timeout-minutes: 30
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # The scanner reads this variable itself, so an empty value would win over the Gradle default.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        # No --configuration-cache here: with it, Sonar resolves the detekt report paths before detekt
        # has written them, which silently drops the detekt findings from the analysis.
        run: ./gradlew -DLibrariesOnly=true sonar --stacktrace
